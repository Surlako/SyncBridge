name: Build SyncBridge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudArchive = Join-Path $env:RUNNER_TEMP "dalamud-latest.zip"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile $dalamudArchive
          Expand-Archive -Force $dalamudArchive "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build SyncBridge.sln --configuration Release

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncBridge
          path: SyncBridge/bin/x64/Release/**
          if-no-files-found: error
          retention-days: 7
